version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: toan3-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-toan3_kntt}
    ports:
      - "5432:5432"
    volumes:
      - toan3_pg_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: toan3-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-toan3_kntt}?schema=public
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - PORT=4000
    depends_on:
      - database

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: toan3-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - api

volumes:
  toan3_pg_data:
